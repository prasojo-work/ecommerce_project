# LYSHEIM on Render — the API, and only the API.
#
# The web app is on Vercel (`ADR-0011`), so this Blueprint is one service. `compose.yml` in this
# repository is the *local* stack and is not deployable here: Render builds from a Dockerfile or a
# prebuilt image, and a compose file is neither. The two share `backend/Dockerfile` and that is the
# whole of the overlap.
#
# Secrets are `sync: false`, which means Render prompts for the value in the Dashboard and never
# stores it in this file. `DJANGO_SECRET_KEY` is generated by Render instead: a value nobody has to
# see is a value nobody can leak. See docs/04-delivery/RUNBOOK.md section 7.

services:
  - type: web
    name: lysheim-api
    runtime: docker
    # Relative to the repository root, matching the build context `compose.yml` uses.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    # The nearest region, and it should match the Supabase project's: every API request is a round
    # trip to the database, so a mismatched pair pays that latency twice. If this region is not
    # offered on the free plan, take the nearest one that is and move Supabase to match.
    region: singapore
    # An uptime probe with no dependencies of its own (`core/views.py`).
    healthCheckPath: /healthz
    autoDeployTrigger: commit

    # A single token, and that is the whole point. This field is a string Render parses: it strips a
    # leading `/bin/sh -c` and hands the remainder to its own shell, so the compound command that
    # used to be here — quoted, as it must be to hold `&&` — collapsed into one word and the first
    # deploy of `M2.7` died with
    #     python manage.py migrate --noinput && ... --port 10000: not found
    # Reproduced locally, same shape: `sh -c '"echo a && echo b"'` gives
    # `sh: echo a && echo b: not found`, while the unquoted form runs both. The work lives in
    # `/app/docker-entrypoint.sh` inside the image now, where it can be read and tested, and this
    # line only names it. The Dockerfile's CMD is that same script, so the image still starts
    # correctly on a host that ignores this field.
    #
    # Pre-deploy commands are for paid instance types, which is why the migrations are on the boot
    # path at all; runbook section 7.4 has the costs. The one invariant to keep: the free plan runs a
    # single instance, so two migrations cannot run at once. If that ever changes, the script needs a
    # lock before it migrates.
    dockerCommand: /app/docker-entrypoint.sh

    envVars:
      - key: DJANGO_ENV
        value: prod
      # `prod.py` refuses to start if this is still the development key, and then owns the rest of
      # the hardening — HTTPS redirect, HSTS, and `Secure`/`SameSite=None` on the refresh cookie —
      # so none of those are set here. A variable and a setting that disagree is a bug waiting to be
      # read twice.
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_LOG_LEVEL
        value: INFO
      # The service tells itself its own hostname, so nobody types it and it cannot go stale. Add any
      # custom domain here by hand later. If this reference does not resolve, set the hostname as a
      # plain value; the symptom is a `400 DisallowedHost` on every request (runbook section 8).
      - key: DJANGO_ALLOWED_HOSTS
        fromService:
          name: lysheim-api
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      # The Supabase *shared pooler* string, with `?sslmode=require`. Not the direct connection: that
      # is IPv6-only on the free plan and Render's free tier is IPv4-only.
      - key: DATABASE_URL
        sync: false
      # The Vercel origin, e.g. https://lysheim.vercel.app — exact, no trailing slash. This list is
      # also the refresh-cookie origin guard, and empty means every cross-origin call is refused.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # One proxy: Render's load balancer. `base.py` explains why both directions of this are wrong
      # — too high and any client can forge its own IP, too low and every visitor shares one bucket.
      - key: NINJA_NUM_PROXIES
        value: 1
      # Deliberately absent, and each for a reason:
      #   JWT_SECRET_KEY — falls back to DJANGO_SECRET_KEY, which Render generates.
      #   CACHE_BACKEND  — the in-process default is correct while there is one instance.
      #   PAYMENT_PROVIDER — the mock provider is the v1 decision (`ADR-0010`).
