[project]
name = "nordvik-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.1",
    "django-ninja>=1.7.1",
    "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "DJ", "UP"]

[tool.basedpyright]
typeCheckingMode = "standard"
