name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

# A newer push to the same ref cancels the still-running check.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  gates:
    name: Formatting, lint, types, tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lysheim
          POSTGRES_PASSWORD: lysheim
          POSTGRES_DB: lysheim
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lysheim -d lysheim"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The suite runs against PostgreSQL, the engine compose and production use. Settings
      # fall back to SQLite only when DATABASE_URL is empty, so this keeps CI honest.
      DATABASE_URL: postgres://lysheim:lysheim@localhost:5432/lysheim
      DJANGO_SECRET_KEY: ci-not-a-real-secret
      DJANGO_DEBUG: "true"

    steps:
      - uses: actions/checkout@v6

      # Pinned to the exact release on purpose: setup-uv stopped publishing floating major tags
      # after v7, so `@v8` does not resolve and the job fails before any step runs. Keep
      # `version` in step with the uv pin in backend/Dockerfile.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Types
        run: uv run basedpyright

      # `--cov` runs the measurement; the threshold and the measured source live in
      # `pyproject.toml` (`NFR-7`: the domain/service layer at 80% minimum), so the runner and a
      # laptop enforce the same number from the same place.
      - name: Tests and coverage
        run: uv run pytest --cov

      # The frontend generates its TypeScript types from the committed snapshot, so the snapshot
      # has to match the code. Regenerate it and fail on any difference. `git -C ..` targets the
      # repository root because every step runs with `backend/` as its working directory.
      - name: OpenAPI contract snapshot
        run: |
          uv run python manage.py export_openapi_schema
          git -C .. diff --exit-code -- frontend/openapi.json

      # `SEC-FIND-1.8`. Last of the steps so the fast gates report first, and a failing step rather
      # than a warning: an advisory nobody is obliged to act on is a log line, not a control.
      - name: Dependency audit
        run: uv run pip-audit
